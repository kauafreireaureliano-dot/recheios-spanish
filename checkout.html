<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Checkout — Rellenos Secretos</title>
<script>
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
  n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}
  (window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('init','904108975631664');
  fbq('track','PageView');
  fbq('track','InitiateCheckout',{value:88,currency:'MXN',content_ids:['rellenos-mx'],content_type:'product'});
</script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<script src="https://js.stripe.com/v3/"></script>
<style>
  :root{--rosa:#e8849a;--marrom:#5c3317;--verde:#2d8a4e}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Nunito',sans-serif;background:linear-gradient(160deg,#fde8ee,#fff5e6);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
  .container{width:100%;max-width:420px}
  .header{text-align:center;margin-bottom:20px}
  .header .emoji{font-size:36px}
  .header h1{font-size:18px;font-weight:900;color:var(--marrom);margin-top:6px}
  .header p{font-size:12px;color:#9a7060}
  .produto-card{background:linear-gradient(135deg,#e8849a,#c9504d);color:#fff;border-radius:16px;padding:16px 20px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 6px 20px rgba(200,80,77,0.3)}
  .produto-card .nome{font-weight:800;font-size:15px}
  .produto-card .desc{font-size:12px;opacity:.85;margin-top:2px}
  .produto-card .preco{font-size:26px;font-weight:900}
  .card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 4px 24px rgba(0,0,0,0.08);margin-bottom:16px}
  label{display:block;font-size:13px;font-weight:700;color:var(--marrom);margin-bottom:6px}
  input[type=text],input[type=email]{width:100%;border:1.5px solid #f0d0d8;border-radius:12px;padding:12px 14px;font-size:14px;font-family:'Nunito',sans-serif;outline:none;transition:border .2s}
  input:focus{border-color:var(--rosa)}
  .field{margin-bottom:16px}
  #express-checkout-element{margin-bottom:4px}
  #payment-element{margin-bottom:16px}
  .divider{display:flex;align-items:center;gap:10px;margin:16px 0;font-size:12px;color:#b09080;font-weight:700}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:#f0d0d8}
  .btn-pagar{width:100%;background:linear-gradient(135deg,#e8849a,#c9504d);color:#fff;font-size:16px;font-weight:900;padding:16px;border:none;border-radius:14px;cursor:pointer;box-shadow:0 6px 20px rgba(200,80,77,0.35);transition:opacity .15s;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn-pagar:disabled{opacity:.6;cursor:not-allowed}
  .erro{color:#c9504d;font-size:13px;font-weight:700;margin-top:10px;text-align:center}
  .seguro{text-align:center;font-size:11px;color:#b09080;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:4px}
  .sucesso{display:none;text-align:center}
  .sucesso .check{font-size:56px;margin-bottom:12px}
  .sucesso h2{font-size:22px;font-weight:900;color:var(--marrom);margin-bottom:8px}
  .sucesso p{font-size:14px;color:#7a5c45;font-weight:600;margin-bottom:20px;line-height:1.6}
  .btn-acesso{display:inline-block;background:linear-gradient(135deg,#e8849a,#c9504d);color:#fff;font-size:15px;font-weight:800;padding:14px 32px;border-radius:50px;text-decoration:none;box-shadow:0 6px 20px rgba(200,80,77,0.35)}
  .spinner{width:20px;height:20px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="emoji">🍰</div>
    <h1>Rellenos Secretos</h1>
    <p>Pago seguro con tarjeta</p>
  </div>

  <div class="produto-card">
    <div>
      <div class="nome">Guia Rellenos Secretos</div>
      <div class="desc">100 recetas — acceso inmediato</div>
    </div>
    <div class="preco">$88 MXN</div>
  </div>

  <div id="form-section">
    <div class="card">
      <h2 style="font-size:15px;font-weight:800;color:var(--marrom);margin-bottom:16px;">Tus datos</h2>
      <div class="field">
        <label>Nombre completo</label>
        <input type="text" id="nome" placeholder="Tu nombre"/>
      </div>
      <div class="field">
        <label>Correo electronico</label>
        <input type="email" id="email" placeholder="tucorreo@email.com"/>
      </div>
      <div id="express-checkout-element"></div>
      <div id="divider-express" class="divider" style="display:none">O paga con tarjeta</div>
      <label>Datos de pago</label>
      <div id="payment-element"></div>
      <div id="erro" class="erro"></div>
      <button class="btn-pagar" id="btn-pagar" onclick="pagar()">
        Pagar $88 MXN
      </button>
      <div class="seguro">Pago seguro procesado por Stripe</div>
    </div>
  </div>

  <div class="card sucesso" id="sucesso">
    <div class="check">Pago confirmado!</div>
    <h2>Muchas gracias!</h2>
    <p>Tu compra fue confirmada.<br/>Haz clic para acceder a tus recetas.</p>
    <a class="btn-acesso" href="https://drive.google.com/file/d/1xncYfL9BqytUgWWEpioNOHWW05jwyIX3/view?usp=sharing">
      Acceder a mis recetas
    </a>
  </div>
</div>

<script>
var stripe = Stripe('pk_live_51R1FcqKxg0oNxUzzsosBDovpAYLPsgY2z11YjmyhlZjhXO4QAV4tjvsQS5PxhAovserkUCJy26Zcr2wpesVXNVnJ00FCft7Dmp');
var elements, paymentElement, clientSecret;

function onSuccess() {
  if (window.fbq) fbq('track','Purchase',{value:88,currency:'MXN',content_ids:['rellenos-mx'],content_type:'product'});
  document.getElementById('form-section').style.display = 'none';
  document.getElementById('sucesso').style.display = 'block';
  setTimeout(function(){ window.location.href = 'https://drive.google.com/file/d/1xncYfL9BqytUgWWEpioNOHWW05jwyIX3/view?usp=sharing'; }, 4000);
}

async function init() {
  var nome = document.getElementById('nome').value;
  var email = document.getElementById('email').value;
  var res = await fetch('/api/create-payment', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({nome: nome, email: email})
  });
  var data = await res.json();
  if (data.error) { document.getElementById('erro').textContent = data.error; return false; }
  clientSecret = data.clientSecret;
  elements = stripe.elements({clientSecret: clientSecret, locale: 'es-419'});
  // Express Checkout (Apple Pay / Google Pay)
  var expressEl = elements.create('expressCheckout', {
    buttonHeight: 48,
    paymentMethods: {applePay: 'always', googlePay: 'always'}
  });
  expressEl.mount('#express-checkout-element');
  expressEl.on('ready', function(e) {
    var m = e.availablePaymentMethods;
    if (m && (m.applePay || m.googlePay)) {
      document.getElementById('divider-express').style.display = 'flex';
    }
  });
  expressEl.on('confirm', async function() {
    var r = await stripe.confirmPayment({
      elements: elements, redirect: 'if_required',
      confirmParams: {return_url: 'https://recheios-spanish.vercel.app/obrigado.html'}
    });
    if (r.error) document.getElementById('erro').textContent = r.error.message;
    else onSuccess();
  });

  // Payment Element (cartão) — sem Apple/Google Pay duplicado
  paymentElement = elements.create('payment', {
    defaultValues: {billingDetails: {address: {country: 'MX'}}},
    wallets: {applePay: 'never', googlePay: 'never'}
  });
  paymentElement.mount('#payment-element');
  return true;
}

document.getElementById('email').addEventListener('blur', function() {
  if (this.value && !elements) init();
});

async function pagar() {
  var nome = document.getElementById('nome').value.trim();
  var email = document.getElementById('email').value.trim();
  var erroEl = document.getElementById('erro');
  var btn = document.getElementById('btn-pagar');
  erroEl.textContent = '';

  if (!nome || !email) { erroEl.textContent = 'Por favor llena todos los campos.'; return; }
  if (!elements) {
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div>';
    var ok = await init();
    btn.disabled = false;
    btn.innerHTML = 'Pagar $88 MXN';
    if (!ok) return;
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div> Procesando...';

  var result = await stripe.confirmPayment({
    elements: elements,
    redirect: 'if_required',
    confirmParams: { return_url: 'https://recheios-spanish.vercel.app/obrigado.html' }
  });

  if (result.error) {
    erroEl.textContent = result.error.message;
    btn.disabled = false;
    btn.innerHTML = 'Pagar $88 MXN';
  } else { onSuccess(); }
}
</script>
</body>
</html>
