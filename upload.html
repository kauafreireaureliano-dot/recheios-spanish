<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Upload de mídia | Recheios Secretos</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#fff7fb;color:#382632;font-family:Arial,sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(100%,560px);background:#fff;border:1px solid #f0d9e6;border-radius:22px;padding:28px;box-shadow:0 12px 40px #713b5b12}h1{margin:0 0 8px;font-size:26px}p{color:#765f6d;line-height:1.5}.field{margin:20px 0}label{display:block;font-weight:700;margin-bottom:8px}input[type=password],input[type=file]{width:100%;padding:13px;border:1px solid #e7cbd9;border-radius:12px;background:#fff}button{width:100%;border:0;border-radius:12px;padding:15px;background:#c94f88;color:white;font-weight:700;font-size:16px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.progress{height:10px;background:#f4e5ed;border-radius:20px;overflow:hidden;margin-top:16px;display:none}.bar{height:100%;width:0;background:#c94f88;transition:width .2s}.status{margin-top:14px;font-size:14px;overflow-wrap:anywhere}.link{display:block;margin-top:10px;color:#a12e69}.note{font-size:12px;color:#8b7782;margin-top:20px}
</style>
</head>
<body><main class="card">
<h1>Central de envio de arquivos</h1>
<p>Envie o vídeo e o áudio diretamente para o armazenamento do site. Não precisa entrar no GitHub.</p>
<div class="field"><label for="password">Senha de acesso</label><input id="password" type="password" autocomplete="current-password" placeholder="Digite sua senha"></div>
<div class="field"><label for="video">Vídeo (MP4, MOV ou WebM)</label><input id="video" type="file" accept="video/mp4,video/quicktime,video/webm"></div>
<button id="sendVideo">Enviar vídeo</button>
<div class="progress" id="vp"><div class="bar" id="vb"></div></div><div class="status" id="vs"></div>
<div class="field"><label for="audio">Áudio (MP3, M4A ou WAV)</label><input id="audio" type="file" accept="audio/mpeg,audio/mp4,audio/wav,audio/x-wav"></div>
<button id="sendAudio">Enviar áudio</button>
<div class="progress" id="ap"><div class="bar" id="ab"></div></div><div class="status" id="as"></div>
<p class="note">Página restrita por senha. Não compartilhe o endereço nem a senha.</p>
</main>
<script type="module">
import { upload } from 'https://esm.sh/@vercel/blob@1.1.1/client';
async function send(kind){
 const isVideo=kind==='video', input=document.getElementById(isVideo?'video':'audio'), btn=document.getElementById(isVideo?'sendVideo':'sendAudio'), status=document.getElementById(isVideo?'vs':'as'), progress=document.getElementById(isVideo?'vp':'ap'), bar=document.getElementById(isVideo?'vb':'ab');
 const file=input.files[0], password=document.getElementById('password').value;
 if(!password){status.textContent='Digite a senha de acesso.';return}
 if(!file){status.textContent='Selecione um arquivo primeiro.';return}
 btn.disabled=true;progress.style.display='block';bar.style.width='0%';status.textContent='Preparando envio...';
 try{
  const ext=(file.name.split('.').pop()|| (isVideo?'mp4':'mp3')).toLowerCase().replace(/[^a-z0-9]/g,'');
  const pathname='media/'+(isVideo?'video':'audio')+'.'+ext;
  const blob=await upload(pathname,file,{access:'public',handleUploadUrl:'/api/upload',clientPayload:JSON.stringify({password,kind}),multipart:file.size>100*1024*1024,onUploadProgress(p){bar.style.width=p.percentage+'%';status.textContent='Enviando: '+Math.round(p.percentage)+'%'}});
  bar.style.width='100%';status.innerHTML='Envio concluído! <a class="link" target="_blank" rel="noopener" href="'+blob.url+'">Abrir arquivo enviado</a><button type="button" class="copy" style="margin-top:10px" data-url="'+blob.url+'">Copiar link</button>';
  status.querySelector('.copy').addEventListener('click',()=>navigator.clipboard.writeText(blob.url).then(()=>status.querySelector('.copy').textContent='Link copiado!'));
 }catch(e){status.textContent='Não foi possível enviar: '+(e.message||'erro desconhecido')+'. Confira a senha e a configuração do armazenamento.'}
 finally{btn.disabled=false}
}
document.getElementById('sendVideo').addEventListener('click',()=>send('video'));
document.getElementById('sendAudio').addEventListener('click',()=>send('audio'));
</script></body></html>
